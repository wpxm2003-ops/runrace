apply plugin: 'com.android.application'

// The community background-geolocation plugin requires Capacitor's legacy
// bridge to keep delivering callbacks after Android has backgrounded the
// WebView for several minutes. capacitor.config.json is generated and ignored
// by Git, so fail the native build instead of silently shipping a stale config.
tasks.register("verifyBackgroundTrackingConfig") {
    group = "verification"
    description = "Verifies the generated Capacitor config keeps Android background tracking alive."
    doLast {
        def configFile = file("src/main/assets/capacitor.config.json")
        if (!configFile.exists()) {
            throw new GradleException(
                "Missing ${configFile}. Run `npm run cap:sync:android` before building the Android app."
            )
        }

        def config
        try {
            config = new groovy.json.JsonSlurper().parse(configFile)
        } catch (Exception exception) {
            throw new GradleException("Unable to parse ${configFile}: ${exception.message}", exception)
        }

        def androidConfig = config instanceof Map ? config.get("android") : null
        def legacyBridge = androidConfig instanceof Map ? androidConfig.get("useLegacyBridge") : null
        if (legacyBridge != true) {
            throw new GradleException(
                "android.useLegacyBridge must be true for background workout tracking. "
                + "Run `npm run cap:sync:android` and rebuild; do not ship this APK/AAB."
            )
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("verifyBackgroundTrackingConfig")
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.runrace.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.runrace.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
